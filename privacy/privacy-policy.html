<script>
const contact = 'contact@adrianobr.com';
const updated = '9 October 2026';
const policies = {
en:{label:'English',title:'Privacy Policy',date:'Last updated: 9 October 2026',intro:'This Privacy Policy applies to the Minhas Notas application (“the App”), provided by Adriano BR (“we”). It explains how the App handles information when you use it.',sections:[['Information handled by the App','The notes, folders, images, links, preferences, and any PIN created by you are stored locally on your device. They are used only to provide the App’s core functions.\n\nThe App does not require account creation and does not send your notes or folders to our servers.'],['Backups and sharing','The App provides manual backup and restore features. A backup is created only when you choose that action and is saved in a location you select on your device or storage provider. When you use Android sharing, you choose the receiving app; its privacy practices apply to that transfer.'],['Permissions and device features','The App may request access only when needed for a feature you initiate, such as choosing or saving a backup file, adding an image, sharing content, or using device biometrics. Biometric data is processed by Android and is not collected or stored by us.'],['Data collection and sharing','The current version of the App does not include advertising, analytics, user accounts, or a service that collects and shares your notes or personal information with us or third parties.'],['Retention and deletion','Your content remains on your device until you delete it, clear the App’s storage, or uninstall the App. You control your manual backup files and may delete them at any time.'],['Security','The App uses Android platform features to protect local access, including an optional PIN or biometric authentication when available. No security measure can guarantee absolute protection; keep your device and backup files secure.'],['Children','The App is not designed to knowingly collect personal information from children. Because data is stored locally, parents or guardians should supervise a child’s use of the App and any sharing or backup actions.'],['Changes to this policy','We may update this policy when the App or its data practices change. The current version will be published at this page with a new update date.'],['Contact','For privacy questions, contact us at <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.']]},
pt:{label:'Português',title:'Política de Privacidade',date:'Última atualização: 9 de outubro de 2026',intro:'Esta Política de Privacidade aplica-se ao aplicativo Minhas Notas (“Aplicativo”), fornecido por Adriano BR (“nós”). Ela explica como o Aplicativo trata as informações quando você o utiliza.',sections:[['Informações tratadas pelo Aplicativo','As notas, pastas, imagens, links, preferências e qualquer PIN criado por você são armazenados localmente no seu dispositivo. Esses dados são usados somente para oferecer as funções principais do Aplicativo.\n\nO Aplicativo não exige a criação de conta e não envia suas notas ou pastas para nossos servidores.'],['Backup e compartilhamento','O Aplicativo oferece recursos de backup e restauração manuais. Um backup é criado somente quando você escolhe essa ação e é salvo em um local selecionado por você no dispositivo ou provedor de armazenamento. Ao usar o compartilhamento do Android, você escolhe o aplicativo que receberá o conteúdo; as práticas de privacidade dele se aplicam a essa transferência.'],['Permissões e recursos do dispositivo','O Aplicativo pode solicitar acesso apenas quando necessário para um recurso iniciado por você, como escolher ou salvar um arquivo de backup, adicionar uma imagem, compartilhar conteúdo ou usar a biometria do dispositivo. Os dados biométricos são processados pelo Android e não são coletados nem armazenados por nós.'],['Coleta e compartilhamento de dados','A versão atual do Aplicativo não inclui publicidade, análise de uso, contas de usuário nem serviço que colete ou compartilhe suas notas ou informações pessoais conosco ou com terceiros.'],['Retenção e exclusão','Seu conteúdo permanece no dispositivo até que você o exclua, limpe o armazenamento do Aplicativo ou desinstale o Aplicativo. Você controla seus arquivos de backup manuais e pode excluí-los a qualquer momento.'],['Segurança','O Aplicativo usa recursos da plataforma Android para proteger o acesso local, incluindo PIN opcional ou autenticação biométrica quando disponível. Nenhuma medida de segurança garante proteção absoluta; mantenha seu dispositivo e arquivos de backup protegidos.'],['Crianças','O Aplicativo não foi criado para coletar intencionalmente informações pessoais de crianças. Como os dados são locais, pais ou responsáveis devem supervisionar o uso do Aplicativo e ações de compartilhamento ou backup por crianças.'],['Alterações nesta política','Podemos atualizar esta política quando o Aplicativo ou suas práticas de dados mudarem. A versão atual será publicada nesta página com uma nova data de atualização.'],['Contato','Para dúvidas sobre privacidade, fale conosco em <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.']]},
es:{label:'Español',title:'Política de privacidad',date:'Última actualización: 9 de octubre de 2026',intro:'Esta Política de privacidad se aplica a la aplicación Minhas Notas (“la Aplicación”), proporcionada por Adriano BR (“nosotros”). Explica cómo la Aplicación trata la información cuando la utilizas.',sections:[['Información tratada por la Aplicación','Las notas, carpetas, imágenes, enlaces, preferencias y cualquier PIN que crees se almacenan localmente en tu dispositivo. Se utilizan únicamente para proporcionar las funciones principales de la Aplicación.\n\nLa Aplicación no requiere crear una cuenta ni envía tus notas o carpetas a nuestros servidores.'],['Copias de seguridad y uso compartido','La Aplicación ofrece funciones manuales de copia de seguridad y restauración. Una copia se crea solo cuando eliges esa acción y se guarda en la ubicación que seleccionas en tu dispositivo o proveedor de almacenamiento. Al usar la función Compartir de Android, eliges la aplicación receptora; sus prácticas de privacidad se aplican a esa transferencia.'],['Permisos y funciones del dispositivo','La Aplicación puede solicitar acceso solo cuando es necesario para una función que inicias, como elegir o guardar un archivo de copia, añadir una imagen, compartir contenido o usar la biometría del dispositivo. Los datos biométricos son procesados por Android y no los recopilamos ni almacenamos.'],['Recopilación y uso compartido de datos','La versión actual de la Aplicación no incluye publicidad, análisis, cuentas de usuario ni un servicio que recopile o comparta tus notas o información personal con nosotros o terceros.'],['Conservación y eliminación','Tu contenido permanece en tu dispositivo hasta que lo elimines, borres el almacenamiento de la Aplicación o la desinstales. Controlas tus archivos de copia manuales y puedes eliminarlos en cualquier momento.'],['Seguridad','La Aplicación usa funciones de Android para proteger el acceso local, incluido un PIN opcional o autenticación biométrica cuando está disponible. Ninguna medida garantiza protección absoluta; protege tu dispositivo y archivos de copia.'],['Niños','La Aplicación no está diseñada para recopilar deliberadamente información personal de niños. Como los datos se almacenan localmente, los padres o tutores deben supervisar el uso y las acciones de compartir o copia de seguridad.'],['Cambios en esta política','Podemos actualizar esta política cuando cambien la Aplicación o sus prácticas de datos. La versión vigente se publicará en esta página con una nueva fecha.'],['Contacto','Para consultas de privacidad, escríbenos a <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.']]},
zh:{label:'简体中文',title:'隐私政策',date:'最后更新日期：2026年10月9日',intro:'本隐私政策适用于 Adriano BR 提供的“Minhas Notas”（以下简称“本应用”），说明您使用本应用时信息的处理方式。',sections:[['本应用处理的信息','您创建的笔记、文件夹、图片、链接、偏好设置和 PIN 码均保存在您的设备本地，仅用于提供本应用的核心功能。\n\n本应用无需创建账户，也不会将您的笔记或文件夹发送到我们的服务器。'],['备份和分享','本应用提供手动备份和恢复功能。仅当您主动选择时才会创建备份，并保存到您在设备或存储服务中选择的位置。使用 Android 分享功能时，您自行选择接收应用，该应用的隐私政策将适用于此次传输。'],['权限和设备功能','仅当您发起相应功能时，本应用才可能请求必要访问权限，例如选择或保存备份文件、添加图片、分享内容或使用设备生物识别。生物识别数据由 Android 处理，我们不会收集或存储。'],['数据收集和共享','当前版本不含广告、分析服务、用户账户或任何向我们或第三方收集、共享您的笔记或个人信息的服务。'],['保存和删除','您的内容会保留在设备中，直至您删除内容、清除本应用存储或卸载本应用。您可随时删除手动备份文件。'],['安全','本应用使用 Android 平台功能保护本地访问，包括可选的 PIN 或生物识别认证。没有任何安全措施可以保证绝对安全，请妥善保护设备和备份文件。'],['儿童','本应用不会故意收集儿童个人信息。由于数据保存在本地，家长或监护人应监督儿童使用本应用以及分享或备份操作。'],['本政策的变更','当本应用或数据处理方式发生变化时，我们可能更新本政策。最新版本将发布在本页面并标注新的更新日期。'],['联系方式','如有隐私问题，请联系 <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>。']]},
hi:{label:'हिन्दी',title:'गोपनीयता नीति',date:'अंतिम अपडेट: 9 अक्टूबर 2026',intro:'यह गोपनीयता नीति Adriano BR द्वारा उपलब्ध कराए गए Minhas Notas (“ऐप”) पर लागू होती है और बताती है कि आपके उपयोग के दौरान जानकारी कैसे संभाली जाती है।',sections:[['ऐप द्वारा संभाली जाने वाली जानकारी','आपके नोट, फ़ोल्डर, चित्र, लिंक, प्राथमिकताएँ और बनाया गया PIN आपके डिवाइस पर स्थानीय रूप से संग्रहीत होते हैं। इनका उपयोग केवल ऐप की मुख्य सुविधाएँ देने के लिए होता है।\n\nऐप को खाता बनाने की आवश्यकता नहीं है और यह आपके नोट या फ़ोल्डर हमारे सर्वर पर नहीं भेजता।'],['बैकअप और साझा करना','ऐप मैन्युअल बैकअप और पुनर्स्थापना सुविधाएँ देता है। बैकअप केवल आपके चुनने पर बनता है और आपके डिवाइस या स्टोरेज प्रदाता में चुने गए स्थान पर सहेजा जाता है। Android के शेयर विकल्प में आप प्राप्त करने वाला ऐप चुनते हैं; उस ऐप की गोपनीयता प्रथाएँ उस स्थानांतरण पर लागू होती हैं।'],['अनुमतियाँ और डिवाइस सुविधाएँ','ऐप केवल आपके द्वारा शुरू की गई सुविधा के लिए आवश्यक होने पर ही अनुमति मांग सकता है, जैसे बैकअप फ़ाइल चुनना या सहेजना, चित्र जोड़ना, सामग्री साझा करना या बायोमेट्रिक्स का उपयोग करना। बायोमेट्रिक डेटा Android द्वारा संसाधित होता है और हम उसे एकत्र या संग्रहीत नहीं करते।'],['डेटा संग्रह और साझा करना','ऐप के वर्तमान संस्करण में विज्ञापन, विश्लेषण, उपयोगकर्ता खाते या ऐसा कोई सेवा नहीं है जो आपके नोट या व्यक्तिगत जानकारी को हमसे या तृतीय पक्षों से एकत्र या साझा करे।'],['रखरखाव और हटाना','आपकी सामग्री तब तक डिवाइस पर रहती है जब तक आप उसे हटाते नहीं, ऐप का स्टोरेज साफ़ नहीं करते या ऐप अनइंस्टॉल नहीं करते। आप अपनी मैन्युअल बैकअप फ़ाइलें कभी भी हटा सकते हैं।'],['सुरक्षा','ऐप स्थानीय पहुँच की सुरक्षा के लिए Android सुविधाओं का उपयोग करता है, जिसमें उपलब्ध होने पर वैकल्पिक PIN या बायोमेट्रिक प्रमाणीकरण शामिल है। कोई भी सुरक्षा उपाय पूर्ण सुरक्षा की गारंटी नहीं देता; अपना डिवाइस और बैकअप सुरक्षित रखें।'],['बच्चे','ऐप बच्चों की व्यक्तिगत जानकारी जानबूझकर एकत्र करने के लिए नहीं बनाया गया है। चूँकि डेटा स्थानीय है, माता-पिता या अभिभावक बच्चों के उपयोग और बैकअप या साझा करने की कार्रवाइयों की निगरानी करें।'],['नीति में बदलाव','ऐप या डेटा प्रथाएँ बदलने पर हम यह नीति अपडेट कर सकते हैं। वर्तमान संस्करण नई तिथि के साथ इस पृष्ठ पर प्रकाशित होगा।'],['संपर्क','गोपनीयता संबंधी प्रश्नों के लिए <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a> पर संपर्क करें।']]},
fr:{label:'Français',title:'Politique de confidentialité',date:'Dernière mise à jour : 9 octobre 2026',intro:'Cette politique de confidentialité s’applique à l’application Minhas Notas (« l’Application »), fournie par Adriano BR (« nous »). Elle explique comment l’Application traite les informations lors de son utilisation.',sections:[['Informations traitées par l’Application','Les notes, dossiers, images, liens, préférences et tout code PIN que vous créez sont stockés localement sur votre appareil. Ils servent uniquement à fournir les fonctions principales de l’Application.\n\nL’Application ne nécessite pas de compte et n’envoie pas vos notes ou dossiers à nos serveurs.'],['Sauvegardes et partage','L’Application propose des fonctions manuelles de sauvegarde et de restauration. Une sauvegarde est créée uniquement lorsque vous le choisissez et est enregistrée à l’emplacement que vous sélectionnez sur votre appareil ou auprès de votre fournisseur de stockage. Lorsque vous utilisez le partage Android, vous choisissez l’application destinataire ; ses pratiques de confidentialité s’appliquent au transfert.'],['Autorisations et fonctions de l’appareil','L’Application peut demander un accès uniquement lorsqu’il est nécessaire à une fonction que vous lancez, par exemple choisir ou enregistrer une sauvegarde, ajouter une image, partager du contenu ou utiliser la biométrie. Les données biométriques sont traitées par Android et ne sont ni collectées ni stockées par nous.'],['Collecte et partage de données','La version actuelle de l’Application ne comprend ni publicité, ni analyse, ni compte utilisateur, ni service qui collecte ou partage vos notes ou informations personnelles avec nous ou des tiers.'],['Conservation et suppression','Votre contenu reste sur votre appareil jusqu’à ce que vous le supprimiez, effaciez le stockage de l’Application ou désinstalliez l’Application. Vous contrôlez vos fichiers de sauvegarde manuels et pouvez les supprimer à tout moment.'],['Sécurité','L’Application utilise les fonctions Android pour protéger l’accès local, notamment un code PIN facultatif ou l’authentification biométrique lorsqu’elle est disponible. Aucune mesure ne garantit une protection absolue ; protégez votre appareil et vos sauvegardes.'],['Enfants','L’Application n’est pas conçue pour collecter sciemment des informations personnelles d’enfants. Les données étant locales, les parents ou tuteurs doivent superviser l’utilisation et les actions de partage ou de sauvegarde.'],['Modifications de cette politique','Nous pouvons mettre à jour cette politique lorsque l’Application ou ses pratiques changent. La version en vigueur sera publiée ici avec une nouvelle date.'],['Contact','Pour toute question de confidentialité, contactez <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.']]},
ar:{label:'العربية',title:'سياسة الخصوصية',date:'آخر تحديث: 9 أكتوبر 2026',intro:'تنطبق سياسة الخصوصية هذه على تطبيق Minhas Notas («التطبيق») المقدم من Adriano BR («نحن»)، وتوضح كيفية تعامل التطبيق مع المعلومات عند استخدامه.',sections:[['المعلومات التي يعالجها التطبيق','تُحفظ الملاحظات والمجلدات والصور والروابط والتفضيلات وأي رمز PIN تنشئه محليًا على جهازك. وتُستخدم فقط لتقديم وظائف التطبيق الأساسية.\n\nلا يتطلب التطبيق إنشاء حساب ولا يرسل ملاحظاتك أو مجلداتك إلى خوادمنا.'],['النسخ الاحتياطي والمشاركة','يوفر التطبيق النسخ الاحتياطي والاستعادة يدويًا. لا يُنشأ النسخ الاحتياطي إلا عندما تختار ذلك، ويُحفظ في الموقع الذي تحدده على جهازك أو لدى مزود التخزين. عند استخدام مشاركة Android، تختار التطبيق المستلم، وتنطبق ممارسات الخصوصية الخاصة به على هذا النقل.'],['الأذونات وميزات الجهاز','قد يطلب التطبيق الوصول فقط عند الحاجة إلى ميزة تبدأها أنت، مثل اختيار ملف نسخ احتياطي أو حفظه، أو إضافة صورة، أو مشاركة محتوى، أو استخدام القياسات الحيوية. تعالج Android البيانات الحيوية ولا نجمعها أو نخزنها.'],['جمع البيانات ومشاركتها','لا تتضمن النسخة الحالية من التطبيق إعلانات أو تحليلات أو حسابات مستخدمين أو خدمة تجمع أو تشارك ملاحظاتك أو معلوماتك الشخصية معنا أو مع أطراف ثالثة.'],['الاحتفاظ والحذف','يبقى محتواك على جهازك حتى تحذفه أو تمسح تخزين التطبيق أو تزيل التطبيق. أنت تتحكم في ملفات النسخ الاحتياطي اليدوية ويمكنك حذفها في أي وقت.'],['الأمان','يستخدم التطبيق ميزات Android لحماية الوصول المحلي، بما في ذلك PIN اختياري أو مصادقة حيوية عند توفرها. لا يضمن أي إجراء أمان حماية مطلقة؛ حافظ على أمان جهازك وملفات النسخ الاحتياطي.'],['الأطفال','لا صُمم التطبيق لجمع المعلومات الشخصية من الأطفال عن علم. ولأن البيانات محلية، يجب على الوالدين أو الأوصياء الإشراف على استخدام الأطفال وإجراءات المشاركة أو النسخ الاحتياطي.'],['التغييرات على هذه السياسة','قد نحدّث هذه السياسة عند تغير التطبيق أو ممارسات البيانات. ستُنشر النسخة الحالية في هذه الصفحة مع تاريخ تحديث جديد.'],['الاتصال','لأسئلة الخصوصية، اتصل بنا على <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.']]},
bn:{label:'বাংলা',title:'গোপনীয়তা নীতি',date:'সর্বশেষ হালনাগাদ: ৯ অক্টোবর ২০২৬',intro:'এই গোপনীয়তা নীতি Adriano BR-এর প্রদত্ত Minhas Notas (“অ্যাপ”)-এর ক্ষেত্রে প্রযোজ্য এবং অ্যাপ ব্যবহার করলে তথ্য কীভাবে পরিচালিত হয় তা ব্যাখ্যা করে।',sections:[['অ্যাপের পরিচালিত তথ্য','আপনার নোট, ফোল্ডার, ছবি, লিংক, পছন্দ এবং তৈরি করা PIN আপনার ডিভাইসে স্থানীয়ভাবে সংরক্ষিত থাকে। এগুলো শুধু অ্যাপের মূল সুবিধা দেওয়ার জন্য ব্যবহৃত হয়।\n\nঅ্যাপে অ্যাকাউন্ট তৈরি করতে হয় না এবং এটি আপনার নোট বা ফোল্ডার আমাদের সার্ভারে পাঠায় না।'],['ব্যাকআপ ও শেয়ারিং','অ্যাপটি ম্যানুয়াল ব্যাকআপ ও পুনরুদ্ধার সুবিধা দেয়। আপনি বেছে নিলেই কেবল ব্যাকআপ তৈরি হয় এবং আপনার ডিভাইস বা স্টোরেজ সেবায় নির্বাচিত স্থানে রাখা হয়। Android শেয়ার ব্যবহার করলে আপনি গ্রহণকারী অ্যাপ বেছে নেন; সেই অ্যাপের গোপনীয়তা নীতি ওই স্থানান্তরে প্রযোজ্য।'],['অনুমতি ও ডিভাইসের সুবিধা','শুধু আপনার শুরু করা ফিচারের জন্য দরকার হলেই অ্যাপ অনুমতি চাইতে পারে, যেমন ব্যাকআপ ফাইল বেছে নেওয়া বা সংরক্ষণ করা, ছবি যোগ করা, কনটেন্ট শেয়ার করা বা বায়োমেট্রিক ব্যবহার করা। বায়োমেট্রিক তথ্য Android প্রক্রিয়া করে; আমরা তা সংগ্রহ বা সংরক্ষণ করি না।'],['তথ্য সংগ্রহ ও শেয়ার','অ্যাপের বর্তমান সংস্করণে বিজ্ঞাপন, অ্যানালিটিক্স, ব্যবহারকারী অ্যাকাউন্ট বা এমন কোনো সেবা নেই যা আপনার নোট বা ব্যক্তিগত তথ্য আমাদের বা তৃতীয় পক্ষের সঙ্গে সংগ্রহ বা শেয়ার করে।'],['সংরক্ষণ ও মুছে ফেলা','আপনি মুছে না ফেলা, অ্যাপের স্টোরেজ পরিষ্কার না করা বা অ্যাপ আনইনস্টল না করা পর্যন্ত কনটেন্ট ডিভাইসে থাকে। ম্যানুয়াল ব্যাকআপ ফাইল আপনার নিয়ন্ত্রণে এবং যেকোনো সময় মুছে ফেলতে পারেন।'],['নিরাপত্তা','স্থানীয় প্রবেশাধিকার সুরক্ষায় অ্যাপ Android-এর সুবিধা ব্যবহার করে, যেমন উপলভ্য হলে ঐচ্ছিক PIN বা বায়োমেট্রিক প্রমাণীকরণ। কোনো ব্যবস্থা সম্পূর্ণ নিরাপত্তা নিশ্চিত করে না; ডিভাইস ও ব্যাকআপ ফাইল সুরক্ষিত রাখুন।'],['শিশু','অ্যাপটি জেনেশুনে শিশুদের ব্যক্তিগত তথ্য সংগ্রহের জন্য তৈরি নয়। তথ্য স্থানীয়ভাবে থাকে বলে অভিভাবকদের শিশুদের ব্যবহার এবং শেয়ার বা ব্যাকআপ কাজ তদারকি করা উচিত।'],['এই নীতির পরিবর্তন','অ্যাপ বা তথ্য ব্যবহারের পদ্ধতি বদলালে আমরা এই নীতি হালনাগাদ করতে পারি। বর্তমান সংস্করণ নতুন তারিখসহ এই পাতায় প্রকাশ করা হবে।'],['যোগাযোগ','গোপনীয়তা সম্পর্কে প্রশ্নের জন্য <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>-এ যোগাযোগ করুন।']]},
ru:{label:'Русский',title:'Политика конфиденциальности',date:'Дата обновления: 9 октября 2026 г.',intro:'Настоящая Политика конфиденциальности относится к приложению Minhas Notas («Приложение»), предоставляемому Adriano BR («мы»), и объясняет порядок обработки информации при его использовании.',sections:[['Информация, обрабатываемая Приложением','Созданные вами заметки, папки, изображения, ссылки, настройки и PIN-код хранятся локально на вашем устройстве. Они используются только для основных функций Приложения.\n\nПриложение не требует создания учетной записи и не отправляет ваши заметки или папки на наши серверы.'],['Резервное копирование и обмен','Приложение предоставляет ручное резервное копирование и восстановление. Копия создается только по вашему выбору и сохраняется в указанном вами месте на устройстве или у поставщика хранилища. При использовании функции Android «Поделиться» вы выбираете получающее приложение; к передаче применяются его правила конфиденциальности.'],['Разрешения и функции устройства','Приложение может запросить доступ только для функции, которую вы запускаете: выбора или сохранения файла резервной копии, добавления изображения, обмена содержимым или использования биометрии. Биометрические данные обрабатываются Android; мы их не собираем и не храним.'],['Сбор и передача данных','Текущая версия Приложения не включает рекламу, аналитику, учетные записи пользователей или службу, которая собирает либо передает ваши заметки или личные данные нам или третьим лицам.'],['Хранение и удаление','Ваше содержимое остается на устройстве, пока вы его не удалите, не очистите хранилище Приложения или не удалите Приложение. Вы управляете ручными резервными копиями и можете удалить их в любое время.'],['Безопасность','Приложение использует возможности Android для защиты локального доступа, включая дополнительный PIN или биометрическую аутентификацию при ее наличии. Ни одна мера не гарантирует абсолютную защиту; защищайте устройство и резервные копии.'],['Дети','Приложение не предназначено для намеренного сбора персональных данных детей. Поскольку данные хранятся локально, родители или опекуны должны контролировать использование детьми и действия по обмену или резервному копированию.'],['Изменения политики','Мы можем обновить эту политику при изменении Приложения или практик обработки данных. Актуальная версия будет опубликована на этой странице с новой датой.'],['Контакты','По вопросам конфиденциальности напишите на <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.']]},
ur:{label:'اردو',title:'رازداری کی پالیسی',date:'آخری تازہ کاری: 9 اکتوبر 2026',intro:'یہ رازداری کی پالیسی Adriano BR کے فراہم کردہ Minhas Notas (“ایپ”) پر لاگو ہوتی ہے اور بتاتی ہے کہ ایپ استعمال کرنے پر معلومات کو کیسے سنبھالا جاتا ہے۔',sections:[['ایپ کے زیرِ عمل معلومات','آپ کے نوٹس، فولڈرز، تصاویر، لنکس، ترجیحات اور بنایا گیا PIN آپ کے آلے پر مقامی طور پر محفوظ ہوتے ہیں۔ انہیں صرف ایپ کی بنیادی سہولیات فراہم کرنے کے لیے استعمال کیا جاتا ہے۔\n\nایپ کو اکاؤنٹ بنانے کی ضرورت نہیں اور یہ آپ کے نوٹس یا فولڈرز ہمارے سرورز کو نہیں بھیجتی۔'],['بیک اپ اور شیئرنگ','ایپ دستی بیک اپ اور بحالی کی سہولت دیتی ہے۔ بیک اپ صرف آپ کے انتخاب پر بنایا جاتا ہے اور آپ کے آلے یا اسٹوریج فراہم کنندہ میں آپ کے منتخب کردہ مقام پر محفوظ ہوتا ہے۔ Android شیئر استعمال کرنے پر آپ وصول کنندہ ایپ منتخب کرتے ہیں؛ اس ایپ کے رازداری کے طریقے اس منتقلی پر لاگو ہوتے ہیں۔'],['اجازتیں اور آلے کی خصوصیات','ایپ صرف آپ کی شروع کی گئی خصوصیت کے لیے ضرورت ہونے پر رسائی مانگ سکتی ہے، جیسے بیک اپ فائل منتخب یا محفوظ کرنا، تصویر شامل کرنا، مواد شیئر کرنا یا بایومیٹرکس استعمال کرنا۔ بایومیٹرک ڈیٹا Android پراسیس کرتا ہے؛ ہم اسے جمع یا محفوظ نہیں کرتے۔'],['ڈیٹا جمع کرنا اور اشتراک','ایپ کے موجودہ ورژن میں اشتہارات، تجزیات، صارف اکاؤنٹس یا ایسی خدمت شامل نہیں جو آپ کے نوٹس یا ذاتی معلومات کو ہم یا تیسرے فریق کے ساتھ جمع یا شیئر کرے۔'],['برقرار رکھنا اور حذف کرنا','آپ کا مواد اس وقت تک آلے پر رہتا ہے جب تک آپ اسے حذف نہ کریں، ایپ کا اسٹوریج صاف نہ کریں یا ایپ ان انسٹال نہ کریں۔ آپ اپنے دستی بیک اپ فائلوں کو کنٹرول کرتے ہیں اور کبھی بھی حذف کر سکتے ہیں۔'],['سیکیورٹی','ایپ مقامی رسائی کے تحفظ کے لیے Android کی خصوصیات استعمال کرتی ہے، بشمول دستیاب ہونے پر اختیاری PIN یا بایومیٹرک تصدیق۔ کوئی بھی حفاظتی اقدام مکمل تحفظ کی ضمانت نہیں دیتا؛ اپنے آلے اور بیک اپ فائلوں کو محفوظ رکھیں۔'],['بچے','ایپ بچوں کی ذاتی معلومات جان بوجھ کر جمع کرنے کے لیے نہیں بنائی گئی۔ چونکہ ڈیٹا مقامی ہے، والدین یا سرپرستوں کو بچوں کے استعمال اور شیئر یا بیک اپ کے اقدامات کی نگرانی کرنی چاہیے۔'],['اس پالیسی میں تبدیلیاں','ایپ یا ڈیٹا کے طریقوں میں تبدیلی پر ہم یہ پالیسی اپ ڈیٹ کر سکتے ہیں۔ موجودہ ورژن نئی تاریخ کے ساتھ اس صفحے پر شائع ہوگا۔'],['رابطہ','رازداری کے سوالات کے لیے <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a> پر رابطہ کریں۔']]}
};
function getLang(){const p=new URLSearchParams(location.search).get('lang');if(p&&policies[p])return p;const n=navigator.language.toLowerCase();if(n.startsWith('pt'))return'pt';if(n.startsWith('es'))return'es';if(n.startsWith('zh'))return'zh';if(n.startsWith('hi'))return'hi';if(n.startsWith('fr'))return'fr';if(n.startsWith('ar'))return'ar';if(n.startsWith('bn'))return'bn';if(n.startsWith('ru'))return'ru';if(n.startsWith('ur'))return'ur';return'en'}
function render(lang){const x=policies[lang];document.documentElement.lang=lang;document.documentElement.dir=['ar','ur'].includes(lang)?'rtl':'ltr';document.title=x.title+' — Minhas Notas';document.getElementById('languages').innerHTML=Object.entries(policies).map(([k,v])=>`<button class="${k===lang?'active':''}" onclick="render('${k}')">${v.label}</button>`).join('');document.getElementById('policy').innerHTML=`<h1>${x.title}</h1><p class="updated">${x.date}</p><p class="notice">${x.intro}</p>${x.sections.map(s=>`<section><h2>${s[0]}</h2>${s[1].split('\n\n').map(p=>`<p>${p}</p>`).join('')}</section>`).join('')}`;document.getElementById('footer').textContent='Minhas Notas · Adriano BR';}
render(getLang());
</script>
</body>
